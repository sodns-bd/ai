<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HD EARN - Pro AI Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #000000; 
            color: #f3f4f6; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        
        .glass-blur {
            background: rgba(17, 17, 17, 0.75);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-bottom: 0.5px solid rgba(255, 255, 255, 0.1);
        }
        
        .sidebar { 
            background-color: #0c0c0e; 
            border-right: 0.5px solid rgba(255, 255, 255, 0.1); 
        }

        .bubble-user {
            background-color: #0a84ff;
            color: #ffffff;
            border-radius: 20px;
            border-bottom-right-radius: 4px;
        }

        .bubble-ai {
            background-color: #1c1c1e;
            color: #f3f4f6;
            border-radius: 20px;
            border-bottom-left-radius: 4px;
            border: 0.5px solid rgba(255, 255, 255, 0.05);
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3a3a3c; border-radius: 10px; }

        .input-pill {
            background-color: #1c1c1e;
            border: 0.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
        }
        
        @keyframes pop {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .animate-pop { animation: pop 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body class="flex h-screen overflow-hidden text-sm md:text-base">

    <div id="sidebar" class="sidebar w-72 hidden md:flex flex-col z-30 transition-all duration-300">
        <div class="p-4 flex items-center justify-between">
            <h2 class="font-bold text-lg tracking-tight text-white">HD EARN AI</h2>
            <button onclick="createNewChat()" class="text-blue-500 hover:text-blue-400 p-1">
                <i class="fa-solid fa-pen-to-square text-lg"></i>
            </button>
        </div>
        
        <div class="px-3 pb-2">
            <button onclick="createNewChat()" class="w-full bg-[#1c1c1e] hover:bg-[#2c2c2e] text-blue-500 rounded-xl p-3 flex items-center justify-center gap-2 transition-all border border-white/5 font-medium">
                <i class="fa-solid fa-plus"></i> <span>New Chat</span>
            </button>
        </div>
        
        <div class="flex-1 overflow-y-auto px-2 space-y-1 mt-2" id="history-list"></div>
        
        <div onclick="toggleSettings()" class="p-4 border-t border-white/10 flex items-center gap-3 bg-[#1c1c1e]/30 cursor-pointer hover:bg-[#1c1c1e]/50 transition-colors">
            <div class="w-9 h-9 bg-gradient-to-tr from-green-500 to-blue-600 rounded-full flex items-center justify-center font-bold text-white shadow-md">A</div>
            <div class="flex-1 truncate font-medium text-sm text-gray-200">Admin Panel</div>
            <i class="fa-solid fa-gear text-gray-400 hover:text-white transition-colors"></i>
        </div>
    </div>

    <div class="flex-1 flex flex-col relative w-full bg-black">
        
        <header class="glass-blur absolute top-0 w-full z-10 px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <button onclick="toggleSidebarMobile()" class="md:hidden text-blue-500 p-1 mr-1">
                    <i class="fa-solid fa-bars text-xl"></i>
                </button>
                <div class="relative">
                    <select id="model-select" class="bg-[#1c1c1e] text-white border border-white/10 rounded-full px-4 py-1.5 pr-8 outline-none font-medium text-sm cursor-pointer hover:bg-[#2c2c2e] transition-colors appearance-none">
                        <option value="gemini">Gemini Pro (Talk)</option>
                        <option value="image">Cloudflare AI (Draw)</option>
                    </select>
                    <i class="fa-solid fa-chevron-down absolute right-3 top-2.5 text-gray-400 pointer-events-none text-xs"></i>
                </div>
            </div>
            <button onclick="clearCurrentChat()" class="text-xs text-red-400 bg-red-500/10 px-3 py-1.5 rounded-full font-medium hover:bg-red-500/20 transition-colors">Clear</button>
        </header>

        <main id="chat-container" class="flex-1 overflow-y-auto px-4 pt-20 pb-28 scroll-smooth">
            <div id="welcome-screen" class="h-[60vh] flex flex-col items-center justify-center text-center px-4">
                <div class="w-16 h-16 bg-[#1c1c1e] rounded-3xl flex items-center justify-center mb-4 border border-white/5 shadow-xl">
                    <i class="fa-solid fa-wand-magic-sparkles text-2xl text-blue-500"></i>
                </div>
                <h1 class="text-xl font-bold text-white mb-1">HD EARN Pro Studio</h1>
                <p class="text-xs text-gray-400 max-w-xs">সহজে ছবি তৈরি করতে বা কাস্টমার সাপোর্ট পেতে ওপরের ড্রপডাউন থেকে সঠিক ফিচারটি বেছে নিন।</p>
            </div>
            <div id="messages-wrapper" class="hidden flex-col space-y-4 w-full max-w-3xl mx-auto"></div>
        </main>

        <footer class="glass-blur absolute bottom-0 w-full px-4 py-3 pb-6 md:pb-4 z-10">
            <form id="chat-form" class="max-w-3xl mx-auto">
                <div class="input-pill flex items-end gap-2 px-3 py-2.5">
                    <button type="button" onclick="startSpeechInput()" id="mic-btn" class="p-2 text-gray-400 hover:text-white transition-colors" title="ভয়েস ইনপুট">
                        <i class="fa-solid fa-microphone text-base"></i>
                    </button>
                    
                    <textarea id="user-input" rows="1" 
                        class="flex-1 bg-transparent text-white placeholder-gray-500 py-1 focus:outline-none resize-none text-[15px]"
                        placeholder="আপনার বার্তা বা প্রম্পট লিখুন..."
                        oninput="this.style.height = ''; this.style.height = Math.min(this.scrollHeight, 120) + 'px'"></textarea>
                    
                    <button type="submit" id="send-btn" 
                        class="bg-blue-600 hover:bg-blue-500 text-white rounded-full w-8 h-8 flex items-center justify-center flex-shrink-0 transition-transform active:scale-90 disabled:opacity-50">
                        <i class="fa-solid fa-arrow-up text-sm"></i>
                    </button>
                </div>
            </form>
        </footer>
    </div>

    <div id="settings-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/60 backdrop-blur-md p-4">
        <div class="bg-[#1c1c1e] border border-white/10 rounded-2xl w-full max-w-md p-6 animate-pop">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-lg font-bold text-white">Settings & Keys</h3>
                <button onclick="toggleSettings()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs text-gray-400 mb-1.5 uppercase font-semibold">ElevenLabs API Key</label>
                    <input type="password" id="eleven-key" placeholder="Enter ElevenLabs key..." class="w-full bg-black border border-white/10 rounded-xl p-3 text-white outline-none focus:border-blue-500 text-sm">
                </div>
            </div>
            <button onclick="saveConfig()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium rounded-xl py-3 mt-6 transition-all">Save Changes</button>
        </div>
    </div>

    <script>
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const chatContainer = document.getElementById('chat-container');
        const messagesWrapper = document.getElementById('messages-wrapper');
        const welcomeScreen = document.getElementById('welcome-screen');
        const historyList = document.getElementById('history-list');
        const sendBtn = document.getElementById('send-btn');
        const modelSelect = document.getElementById('model-select');
        const settingsModal = document.getElementById('settings-modal');

        const CLOUDFLARE_ACCOUNT_ID = "317c03391f08492a05b4c98f60fa1538";
        const CLOUDFLARE_API_KEY = "cfut_vQCBjXMwlbGWmhOQ6aW6bg1M9nr1PTLrrc5Iq4IGc55931ed";

        let chats = JSON.parse(localStorage.getItem('hd_chats')) || [];
        let currentSessionId = null;

        document.getElementById('eleven-key').value = localStorage.getItem('eleven_key') || '';

        function init() {
            if (chats.length === 0) createNewChat();
            else { renderHistory(); loadChat(chats[0].id); }
        }

        function toggleSettings() { settingsModal.classList.toggle('hidden'); }
        
        function saveConfig() {
            localStorage.setItem('eleven_key', document.getElementById('eleven-key').value);
            toggleSettings();
        }

        function toggleSidebarMobile() {
            const sb = document.getElementById('sidebar');
            sb.classList.toggle('hidden');
            sb.classList.toggle('flex');
        }

        function saveChats() {
            localStorage.setItem('hd_chats', JSON.stringify(chats));
            renderHistory();
        }

        function createNewChat() {
            currentSessionId = Date.now().toString();
            chats.unshift({ id: currentSessionId, title: "New Conversation", messages: [] });
            saveChats();
            loadChat(currentSessionId);
        }

        function renderHistory() {
            historyList.innerHTML = '';
            chats.forEach(c => {
                const isActive = c.id === currentSessionId;
                const btn = document.createElement('button');
                btn.className = `w-full text-left px-3 py-2.5 rounded-xl flex items-center gap-3 truncate transition-colors text-[14px] ${isActive ? 'bg-[#1c1c1e] text-white' : 'hover:bg-[#1c1c1e]/50 text-gray-400'}`;
                btn.onclick = () => loadChat(c.id);
                btn.innerHTML = `<i class="fa-regular fa-comment-dots"></i> <span class="truncate">${c.title}</span>`;
                historyList.appendChild(btn);
            });
        }

        function loadChat(id) {
            currentSessionId = id;
            const current = chats.find(c => c.id === id);
            messagesWrapper.innerHTML = '';
            
            if (current.messages.length === 0) {
                welcomeScreen.classList.remove('hidden');
                messagesWrapper.classList.add('hidden');
            } else {
                welcomeScreen.classList.add('hidden');
                messagesWrapper.classList.remove('hidden');
                messagesWrapper.classList.add('flex');
                current.messages.forEach(msg => appendMessage(msg.role, msg.content, false));
            }
            renderHistory();
            scrollToBottom();
        }

        function clearCurrentChat() {
            const index = chats.findIndex(c => c.id === currentSessionId);
            if (index !== -1) {
                chats[index].messages = [];
                saveChats();
                loadChat(currentSessionId);
            }
        }

        function scrollToBottom() {
            setTimeout(() => { chatContainer.scrollTop = chatContainer.scrollHeight; }, 50);
        }

        function appendMessage(role, content, animate = true) {
            const isUser = role === 'user';
            const wrapper = document.createElement('div');
            wrapper.className = `flex ${isUser ? 'justify-end' : 'justify-start'} ${animate ? 'animate-pop' : ''}`;
            
            const isImage = content.startsWith('<img') || content.startsWith('<div class="relative"');
            const bubbleClass = isUser ? 'bubble-user' : 'bubble-ai';
            
            const ttsButton = (!isUser && !isImage) ? `
                <button onclick="speakText('${content.replace(/'/g, "\\'")}')" class="mt-2 text-xs text-gray-400 hover:text-white flex items-center gap-1.5 transition-colors">
                    <i class="fa-solid fa-volume-high"></i> Listen
                </button>
            ` : '';

            wrapper.innerHTML = `
                <div class="${bubbleClass} px-4 py-3 max-w-[85%] md:max-w-[75%] text-[15px] leading-relaxed shadow-sm">
                    <div>${content}</div>
                    ${ttsButton}
                </div>
            `;
            
            messagesWrapper.appendChild(wrapper);
            scrollToBottom();
        }

        function speakText(text) {
            const voiceKey = localStorage.getItem('eleven_key');
            if(voiceKey) {
                fetch(`https://api.elevenlabs.io/v1/text-to-speech/EXAVITQu4vr4xnSDxMaL`, {
                    method: 'POST',
                    headers: { 'xi-api-key': voiceKey, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text, model_id: "eleven_multilingual_v2" })
                })
                .then(r => r.blob())
                .then(b => new Audio(URL.createObjectURL(b)).play())
                .catch(err => console.error("ElevenLabs Error:", err));
            } else {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'bn-BD';
                window.speechSynthesis.speak(utterance);
            }
        }

        function startSpeechInput() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if(!SpeechRecognition) return alert("স্পিচ রিকগনিশন আপনার ব্রাউজার সাপোর্ট করে না!");
            
            const rec = new SpeechRecognition();
            rec.lang = 'bn-BD';
            const micBtn = document.getElementById('mic-btn');
            micBtn.style.color = '#ef4444';
            
            rec.onresult = (e) => {
                userInput.value = e.results[0][0].transcript;
                micBtn.style.color = '#9ca3af';
            };
            rec.onerror = () => { micBtn.style.color = '#9ca3af'; };
            rec.start();
        }

        userInput.addEventListener('keydown', (e) => {
            if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); chatForm.dispatchEvent(new Event('submit')); }
        });

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if(!text) return;

            welcomeScreen.classList.add('hidden');
            messagesWrapper.classList.remove('hidden');
            messagesWrapper.classList.add('flex');

            userInput.value = '';
            userInput.style.height = '';
            sendBtn.disabled = true;

            const current = chats.find(c => c.id === currentSessionId);
            if(current.messages.length === 0) {
                current.title = text.substring(0, 20) + (text.length > 20 ? '...' : '');
            }

            current.messages.push({ role: 'user', content: text });
            saveChats();
            appendMessage('user', text);

            const mode = modelSelect.value;
            const typingId = 'typing-' + Date.now();
            const typingWrapper = document.createElement('div');
            typingWrapper.id = typingId;
            typingWrapper.className = 'flex justify-start';
            typingWrapper.innerHTML = `
                <div class="bubble-ai px-4 py-3 flex items-center gap-1.5">
                    <i class="fa-solid fa-spinner fa-spin text-sm text-gray-400"></i>
                    <span class="text-xs text-gray-400">${mode === 'image' ? 'ছবি তৈরি হচ্ছে...' : 'উত্তরের অপেক্ষায়...'}</span>
                </div>
            `;
            messagesWrapper.appendChild(typingWrapper);
            scrollToBottom();

            if(mode === 'image') {
                try {
                    const promptText = `Detailed illustration, high resolution, no text, no watermark, 8k, photorealistic: ${text}`;
                    
                    const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(
                        `https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/run/@cf/stabilityai/stable-diffusion-xl-base-1.0`
                    )}`;

                    const response = await fetch(proxyUrl, {
                        method: 'POST',
                        headers: { 
                            'Authorization': `Bearer ${CLOUDFLARE_API_KEY}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ prompt: promptText })
                    });

                    document.getElementById(typingId).remove();
                    
                    if(!response.ok) throw new Error("Cloudflare image request failed");
                    
                    const imgBlob = await response.blob();
                    const imgUrl = URL.createObjectURL(imgBlob);
                    
                    const imageMarkup = `
                        <div class="relative group mt-2 overflow-hidden rounded-xl bg-black/40">
                            <img src="${imgUrl}" class="rounded-xl max-w-full h-auto object-cover max-h-[360px] shadow-lg border border-white/10" alt="Generated by Cloudflare" />
                            <a href="${imgUrl}" download="hd_earn_ai.png" class="absolute bottom-3 right-3 bg-black/70 hover:bg-black p-2 rounded-full text-white text-xs flex items-center justify-center border border-white/15 transition-all shadow-md">
                                <i class="fa-solid fa-download mr-1"></i> Download
                            </a>
                        </div>
                    `;

                    current.messages.push({ role: 'assistant', content: imageMarkup });
                    saveChats();
                    appendMessage('assistant', imageMarkup);

                } catch (error) {
                    document.getElementById(typingId).remove();
                    const errMsg = `<span class="text-red-400 flex items-center gap-2"><i class="fa-solid fa-triangle-exclamation"></i> Cloudflare ছবি জেনারেট করতে ব্যর্থ হয়েছে!</span>`;
                    appendMessage('assistant', errMsg);
                    console.error("Cloudflare Draw error: ", error);
                }
            } else {
                try {
                    const promptContext = encodeURIComponent("You are a professional Customer Support Assistant for HD EARN. Speak ONLY in Bengali.\nUser: " + text);
                    const response = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(`https://gemini-api-real-time.vercel.app/api/ask?prompt=${promptContext}`)}`);
                    
                    document.getElementById(typingId).remove();
                    if(!response.ok) throw new Error("Server communication response failed");
                    
                    const data = await response.json();
                    if (data.success && data.response) {
                        current.messages.push({ role: 'assistant', content: data.response });
                        saveChats();
                        appendMessage('assistant', data.response);
                    } else {
                        throw new Error();
                    }
                } catch (error) {
                    document.getElementById(typingId).remove();
                    const errMarkup = `<span class="text-red-400 flex items-center gap-1.5"><i class="fa-solid fa-circle-exclamation"></i> উত্তর পেতে সমস্যা হচ্ছে। আবার পাঠান।</span>`;
                    appendMessage('assistant', errMarkup);
                }
            }

            sendBtn.disabled = false;
            userInput.focus();
        });

        init();
    </script>
</body>
</html>
